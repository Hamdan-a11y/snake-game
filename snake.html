<!DOCTYPE html>
<html>
    <head>
    <title>Snake Game</title>
    <style>
      #gameCanvas {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }

      #score {
        text-align: center;
        font-size: 140px;
        font-family: sans-serif;
        color: #ddd;
      }
    </style>
  </head>
  <body>
    <div id="score">0</div>

    <canvas id="gameCanvas" width="300" height="300"></canvas>
  <script>
    // 1. Find the canvas element by its id
    const gameCanvas = document.getElementById("gameCanvas");

    // 2. Get the 2D drawing context (think of this as your paintbrush)

    const ctx = gameCanvas.getContext("2d");

    // Represent the snake as an array of coordinate objects
    let snake = [
        {x: 150, y: 150}, // Head (index 0)
        {x: 140, y: 150}, // Body
        {x: 130, y: 150}, // Body
        {x: 120, y: 150}, // Body
        {x: 110, y: 150}  // Tail (last part)
];
    let score = 0;
    let changingDirection = false;
    let dx = 10;
    let dy = 0;
    let foodX;
    let foodY;

    function resetGame() {
      snake = [{x: 150, y: 150}, {x: 140, y: 150}, {x: 130, y: 150}, {x: 120, y: 150}, {x: 110, y: 150}];
      score = 0;
      dx = 10; dy = 0;
      document.getElementById('score').innerHTML = score;
      createFood();
}
    function step(action) {
        if (action === 1) [dx, dy] = [-dy, dx];
        if (action === 2) [dx, dy] = [dy, -dx];
        const didEat = advanceSnake();
        const done = didGameEnd();
        return { reward: done ? -10 : (didEat ? 10 : 0), done };
    }

    function clearCanvas() {
      ctx.fillStyle = "white";
      ctx.strokeStyle = "black";
      ctx.fillRect(0, 0, gameCanvas.width, gameCanvas.height);
      ctx.strokeRect(0, 0, gameCanvas.width, gameCanvas.height);
}

    // Function to draw a single 10x10 block of the snake
    function drawSnakePart(snakePart) {
      ctx.fillStyle = 'lightgreen';
      ctx.strokeStyle='darkgreen';
      ctx.fillRect(snakePart.x, snakePart.y, 10, 10);
      ctx.strokeRect(snakePart.x, snakePart.y, 10, 10);
    }
      // Function to draw all parts of the snake
    function drawSnake() {
      snake.forEach(drawSnakePart);
      }
    function draw() {
      clearCanvas();
      drawFood();
      drawSnake();
}

    function advanceSnake() {
      const head = {x: snake[0].x + dx, y: snake[0].y + dy};
      snake.unshift(head);

      const didEatFood = snake[0].x === foodX && snake[0].y === foodY;

  if (didEatFood) {
    // 1. Add 10 to score
    score += 10;
    // 2. Update the score on the webpage
    document.getElementById('score').innerHTML = score;
    // 3. Generate a new food
    createFood();
  } else {
    // Only remove the tail if it did NOT eat food!
    snake.pop();
  }
    return didEatFood;
}
function changeDirection(event) {
   // 1. Check if the door is locked FIRST:
  if (changingDirection) return;
  // 2. Lock the door:
  changingDirection = true;

  const LEFT_KEY = 37;
  const RIGHT_KEY = 39;
  const UP_KEY = 38;
  const DOWN_KEY = 40;

  const keyPressed = event.keyCode;

  const goingUp = dy === -10;
  const goingDown = dy === 10;
  const goingRight = dx === 10;
  const goingLeft = dx === -10;

  if (keyPressed === LEFT_KEY && !goingRight) {
    dx = -10;
    dy = 0;
  }
  if (keyPressed === UP_KEY && !goingDown) {
    dx = 0;
    dy = -10;
  }
  if (keyPressed === RIGHT_KEY && !goingLeft) {
    dx = 10;
    dy = 0;
  }
  if (keyPressed === DOWN_KEY && !goingUp) {
    dx = 0;
    dy = 10;
  }
}

function main() {
  if (didGameEnd()) return;
  setTimeout(function onTick() {
    changingDirection = false;
    step();
    draw();


    main();
  }, 100);
}

function randomTen(min, max) {
  return Math.round((Math.random() * (max - min) + min) / 10) * 10;
}

function createFood() {
  foodX = randomTen(0, gameCanvas.width - 10);
  foodY = randomTen(0, gameCanvas.height - 10);

  // Check if this new food is sitting on any part of the snake
  snake.forEach(function isFoodOnSnake(part) {
    const foodIsOnSnake = part.x === foodX && part.y === foodY;
    // If it is, re-run createFood to pick a new spot!
    if (foodIsOnSnake) createFood();
  });
}
function drawFood() {
  ctx.fillStyle = 'red';
  ctx.strokeStyle = 'darkred';
  ctx.fillRect(foodX, foodY, 10, 10);
  ctx.strokeRect(foodX, foodY, 10, 10);
}
function didGameEnd() {
  // Check if head bit any part of the body
  for (let i = 4; i < snake.length; i++) {
    const didCollide = snake[i].x === snake[0].x && snake[i].y === snake[0].y;
    if (didCollide) return true;
  }

  // Check if head hit any of the 4 walls
  const hitLeftWall = snake[0].x < 0;
  const hitRightWall = snake[0].x > gameCanvas.width - 10;
  const hitTopWall = snake[0].y < 0;
  const hitBottomWall = snake[0].y > gameCanvas.height - 10;

  return hitLeftWall || hitRightWall || hitTopWall || hitBottomWall;
}

resetGame();
main();
// Listen for arrow key presses on the keyboard
document.addEventListener("keydown", changeDirection);

  </script>  
  </body>
</html>
